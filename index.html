<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#08111f" />
  <title>Xonix</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <div><strong>XONIX</strong><span id="version"> v0.2.6</span></div>
      <div class="stats">
        <span>Livello <b id="level">1</b></span>
        <span>Vite <b id="lives">3</b></span>
        <span>Area <b id="area">0%</b></span>
        <span>Punti <b id="score">0</b></span>
      </div>
    </header>
    <section class="game-wrap">
      <canvas id="game" width="960" height="600" aria-label="Gioco Xonix"></canvas>
      <div id="overlay" class="overlay">
        <div class="panel">
          <h1 id="menuTitle">XONIX</h1>
          <p id="menuText">Conquista il campo, rivela lo sfondo e non farti prendere.</p>
          <div id="difficultyBox" class="difficulty">
            <span>DIFFICOLTÀ</span>
            <div class="difficulty-buttons">
              <button class="diff active" data-difficulty="easy">FACILE</button>
              <button class="diff" data-difficulty="normal">NORMALE</button>
              <button class="diff" data-difficulty="hard">DIFFICILE</button>
            </div>
          </div>
          <button id="startBtn" class="start">GIOCA</button>
        </div>
      </div>
    </section>
    <section class="controls">
      <div class="dpad" aria-label="Comandi direzionali">
        <button data-dir="up">▲</button>
        <div><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div>
      </div>
      <button id="pauseBtn" class="pause">PAUSA</button>
    </section>
    <footer>Frecce / WASD · Touch: pulsanti o swipe</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
